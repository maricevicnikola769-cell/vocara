<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1410">
<meta name="description" content="Voćara: pijaca voća sa srpskih farmi. Najavljeni dolasci farmera, rezervacije i zajednička kupovina.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voćara">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voćara – pijaca voća sa srpskih farmi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#15191a;--muted:#6b726c;--line:#e5e8e2;--green:#1f9a3b;--green2:#e8f5e9;--red:#e0352b;--amber:#f5b301;--amber2:#fff6d6;--ig:#3797f0;--dark:#0e1410;--yellow:#f8c42a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.app{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:5;background:rgba(251,247,240,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.logo{font-weight:800;font-size:24px;color:var(--green)}
.logo span{color:var(--red)}
.pill{background:var(--green2);color:var(--green);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px}
.hero{background:linear-gradient(135deg,#2f6b3a,#4f8a3c);color:#fff;border-radius:18px;padding:20px;margin:16px 0 12px}
.hero h1{font-size:24px;line-height:1.15;margin-bottom:6px}
.hero p{opacity:.92;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.visit{background:#fff;border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}
.visit.feat{border:2px solid var(--amber)}
.vh{display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--green2);flex-shrink:0}
.name{font-weight:600}
.muted{color:var(--muted);font-size:13px}
.meta{padding:0 14px 10px;display:grid;gap:3px;font-size:14px}
.when{display:inline-block;background:var(--ink);color:#fff;font-weight:600;font-size:13px;padding:4px 10px;border-radius:8px}
.badge{font-size:11px;font-weight:700;background:var(--amber2);color:#8a5a00;padding:3px 8px;border-radius:999px;margin-left:auto;white-space:nowrap}
.pack{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px dashed var(--line)}
.pack .e{font-size:30px;width:36px;text-align:center}
.pack .t{flex:1;min-width:0}
.pack .pr{font-weight:700}
.btns{display:flex;flex-direction:column;gap:6px}
.b1{background:var(--green);color:#fff;font-weight:600;padding:8px 12px;border-radius:10px;font-size:14px;white-space:nowrap}
.b1:disabled{opacity:.4}
.b2{background:#eaf3fe;color:var(--ig);font-weight:600;padding:7px 12px;border-radius:10px;font-size:13px;white-space:nowrap}
.left{font-size:12px;font-weight:600;color:var(--green)}
.left.low{color:var(--red)}
h2.sec{font-size:21px;margin:18px 0 4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.primary{width:100%;background:var(--green);color:#fff;font-weight:600;padding:14px;border-radius:12px;margin-top:12px;font-size:16px}
.primary.blue{background:var(--ig)}
.ghost{width:100%;border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:8px;font-weight:600;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{color:var(--green);font-weight:600;margin:14px 0 4px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
nav.bottom button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px;padding:2px 8px;position:relative}
nav.bottom button b{font-size:20px;font-weight:400}
nav.bottom button.on{color:var(--green);font-weight:600}
.dot{position:absolute;top:-2px;right:4px;background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--green2);color:var(--green);font-weight:700;font-size:20px}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-size:18px}
.sum{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.sum.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.res{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.code{font-family:ui-monospace,monospace;font-weight:700;background:var(--green2);color:var(--green);padding:3px 8px;border-radius:6px}
.plans{display:grid;gap:10px;margin-top:10px}
.plan{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;background:#fff}
.plan.on{border-color:var(--green);background:var(--green2)}
.plan .p{font-weight:700;font-size:17px}
.prow{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin-top:8px;font-size:14px}
.chk input{width:auto}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty div{font-size:46px;margin-bottom:8px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.how div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;text-align:center}
.how b{display:block;font-size:22px;margin-bottom:2px}

/* ---- Instagram-style poruke ---- */
.dmtop{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.dmtop h2{font-family:Inter;font-size:22px;font-weight:700}
.newbtn{font-size:26px;line-height:1;color:var(--ink)}
.search{background:#efefef;border:none;border-radius:10px;padding:10px 12px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;width:66px;flex-shrink:0;text-align:center}
.ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.ring.add{background:#dbdbdb}
.ring div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;border:2px solid #fff}
.story span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox{margin-top:6px}
.row{display:flex;gap:12px;align-items:center;padding:9px 0;width:100%;text-align:left}
.gav{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#fde4de,#e6f0e4);display:grid;place-items:center;font-size:28px;flex-shrink:0;position:relative}
.gav small{position:absolute;bottom:-2px;right:-2px;background:#fff;border-radius:50%;font-size:14px;width:22px;height:22px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.row .tx{flex:1;min-width:0}
.row .tt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .tt,.row.unread .pv{font-weight:700;color:var(--ink)}
.bdot{width:9px;height:9px;border-radius:50%;background:var(--ig);flex-shrink:0}
/* chat screen */
.chathead{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top)) !important;z-index:7;background:#fff;border-bottom:1px solid #efefef;display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -16px}
.chathead .gav{width:40px;height:40px;font-size:20px}
.chathead .tt{font-weight:700;font-size:15px}
.chathead .bk{font-size:26px;padding:0 6px 0 0}
.pin{background:#fff;border:1px solid #efefef;border-radius:16px;padding:14px;margin:12px 0}
.pin h4{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.total{font-size:30px;font-weight:800;font-family:Fraunces,serif}
.prog{height:8px;background:#efefef;border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#f9ce34,#ee2a7b,#6228d7)}
.mem{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.ini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.mem .k{margin-left:auto;font-weight:700}
.ok{color:var(--green);font-size:12px;font-weight:700}
.joinrow{display:flex;gap:8px;margin-top:10px}
.joinrow input{flex:1}
.joinrow button{background:var(--ig);color:#fff;font-weight:600;border-radius:10px;padding:0 14px;white-space:nowrap}
.msgs{display:flex;flex-direction:column;gap:3px;padding:6px 0 10px}
.tsep{text-align:center;font-size:11px;color:var(--muted);margin:10px 0 4px}
.mline{display:flex;align-items:flex-end;gap:6px}
.mline.me{justify-content:flex-end}
.mline .ini{width:26px;height:26px;font-size:11px}
.mline .sp{width:26px;flex-shrink:0}
.bub{max-width:74%;padding:9px 13px;border-radius:22px;font-size:15px;background:#efefef;position:relative;line-height:1.35;user-select:none}
.mline.me .bub{background:var(--ig);color:#fff}
.who{font-size:11px;color:var(--muted);margin:6px 0 1px 38px}
.heart{position:absolute;bottom:-9px;right:6px;background:#fff;border-radius:10px;font-size:11px;padding:1px 4px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sysm{align-self:center;text-align:center;font-size:12px;color:var(--muted);margin:8px 20px}
.offer{align-self:flex-start;margin-left:32px;max-width:84%;border:1px solid #efefef;background:#fff;border-radius:18px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.offer .h{font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em}
.offer .p{font-size:22px;font-weight:800;margin:2px 0}
.typing{display:flex;gap:4px;padding:12px 14px;background:#efefef;border-radius:22px;width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:#999;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.quick button{white-space:nowrap;border:1px solid #dbdbdb;border-radius:999px;padding:6px 12px;font-size:13px;background:#fff}
.composer{position:sticky;bottom:72px;background:var(--bg);padding:8px 0 6px}
.composer form{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dbdbdb;border-radius:24px;padding:4px 4px 4px 14px}
.composer input{border:none;padding:8px 0;background:transparent}
.composer input:focus{outline:none}
.composer button{color:var(--ig);font-weight:700;padding:8px 12px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.st.open{background:#eaf3fe;color:var(--ig)}.st.offer{background:var(--amber2);color:#8a5a00}.st.deal{background:var(--green2);color:var(--green)}
.qrbox{display:grid;place-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:12px 0}
.qrbox img,.qrbox canvas{width:210px;height:210px}
.demo{background:#fdecea;color:var(--red);font-size:12px;font-weight:700;padding:7px 10px;border-radius:8px;text-align:center;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv b{word-break:break-word}
.paidtag{margin-top:8px;background:var(--green2);color:var(--green);font-weight:700;padding:9px;border-radius:10px;text-align:center;font-size:14px}
.ipsbtn{width:100%;margin-top:8px;background:#1a1f71;color:#fff;font-weight:600;padding:12px;border-radius:12px;font-size:15px}
.inv{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.inv.unpaid{border:2px solid var(--amber)}
.steps{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.thumb{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:30px;flex-shrink:0;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.salebadge{position:absolute;top:3px;left:3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:6px}
.old{color:var(--muted);text-decoration:line-through;font-size:13px;font-weight:500;margin-right:4px}
.sales{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.scard{flex:0 0 150px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left}
.scard .im{height:96px;display:grid;place-items:center;font-size:48px;position:relative}
.scard .im img{width:100%;height:100%;object-fit:cover}
.scard .tx{padding:8px 10px 10px;font-size:13px}
.scard .pct{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.sechead h3{font-size:18px}
.bell{position:relative;font-size:22px;padding:4px 8px}
.bell .dot{top:-2px;right:0}
.pop{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);width:min(94vw,520px);background:rgba(255,255,255,.98);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;z-index:40;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.pop.show{transform:translate(-50%,0)}
.pop .thumb{width:52px;height:52px}
.pop .tx{flex:1;min-width:0;font-size:14px}
.pop .tx b{display:block}
.pop .x{font-size:18px;color:var(--muted);padding:4px}
.ntf{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ntf.new{font-weight:600}
.ntf .thumb{width:48px;height:48px}
.upl{display:flex;gap:10px;align-items:center;margin-top:6px}
.upl .thumb{width:64px;height:64px;background:#f3efe8;font-size:22px}
.upl label{margin:0;display:inline-block;background:#f3efe8;padding:9px 12px;border-radius:10px;font-weight:600;cursor:pointer}
.upl input{display:none}
.bimg{max-width:220px;border-radius:18px;display:block}
.mline.me .bub.ph,.bub.ph{padding:3px;background:transparent}
.camb{font-size:22px;padding:4px 4px 4px 0;cursor:pointer}
.camb input{display:none}
/* ===== Dizajn: tamno zaglavlje, fotografije, zelene cene ===== */
body{padding-bottom:84px}
header.app{background:var(--dark);border:none;backdrop-filter:none;color:#fff;border-radius:0 0 26px 26px}
header.app.home{border-radius:0}
.top{padding:12px 16px 14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-align:left}
.brand svg{width:46px;height:46px;flex-shrink:0}
.brand b{display:block;font-style:italic;font-weight:800;font-size:25px;line-height:1}
.brand small{display:block;font-size:13px;opacity:.85;margin-top:3px}
.hicons{display:flex;align-items:center;gap:4px}
.hicon{position:relative;color:#fff;padding:6px;display:grid;place-items:center}
.hicon svg{width:28px;height:28px}
.hicon .dot{top:0;right:0;background:var(--red)}
.ptitle{display:flex;align-items:center;gap:8px;color:#fff}
.ptitle h1{font-size:20px;font-weight:700}
.ptitle .bk{color:#fff;padding:4px 6px 4px 0;display:grid;place-items:center}
.ptitle .bk svg{width:26px;height:26px}
.hero3{position:relative;margin:0 -16px;background:linear-gradient(100deg,#0e1410 0%,#18301b 45%,#2c5a24 100%);color:#fff;padding:26px 16px 30px;overflow:hidden;border-radius:0 0 0 0}
.hero3:before{content:"";position:absolute;left:-10%;right:-10%;top:-40px;height:60px;background:var(--dark);border-radius:0 0 50% 50%}
.hero3 .crate{position:absolute;right:-6px;bottom:14px;width:52%;max-width:260px;border-radius:18px;transform:rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero3 h1{position:relative;font-size:31px;line-height:1.12;max-width:62%;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.cta{position:relative;margin-top:16px;background:var(--yellow);color:#1b1b1b;font-weight:700;font-size:17px;padding:13px 20px;border-radius:999px;display:inline-flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(248,196,42,.35)}
.feats{position:relative;margin:0 0 6px;background:#fff;border-radius:22px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.feat{background:#f6f7f4;border-radius:16px;padding:12px 6px;text-align:center;font-size:13px;line-height:1.25;color:#333}
.feat svg{width:30px;height:30px;color:var(--green);display:block;margin:0 auto 6px}
.shead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.shead h2{font-size:23px}
.shead button{color:var(--green);font-weight:600;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.pcard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);text-align:left;display:flex;flex-direction:column;cursor:pointer}
.pimg{height:128px;position:relative;display:grid;place-items:center;font-size:58px;background:#fff}
.pimg img{width:100%;height:100%;object-fit:cover}
.tagn{position:absolute;top:10px;left:10px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.tagn.sale{background:var(--red)}
.pbody{padding:8px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.pn{font-weight:600;font-size:15px;line-height:1.2}
.pk{font-size:12px;color:var(--muted)}
.prow2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:6px}
.pp{color:var(--green);font-weight:800;font-size:20px;line-height:1}
.pp small{color:var(--ink);font-weight:500;font-size:13px}
.pp s{display:block;color:var(--muted);font-size:12px;font-weight:500}
.cartb{background:var(--green);color:#fff;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.cartb svg{width:24px;height:24px}

<script>
const fmt=n=>Math.round(n).toLocaleString('sr-RS')+' RSD';
const DAYS=['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
const DAYS_GEN=['nedelje','ponedeljka','utorka','srede','četvrtka','petka','subote'];
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const SAVE=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(window.onSave)onSave(k)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MUNS=['Arilje','Beograd','Grocka','Bor','Čačak','Gornji Milanovac','Irig','Ivanjica','Jagodina','Kosjerić','Kragujevac','Kraljevo','Kruševac','Leskovac','Loznica','Negotin','Niš','Novi Pazar','Novi Sad','Pančevo','Pirot','Požarevac','Prokuplje','Šabac','Smederevo','Smederevska Palanka','Sombor','Subotica','Topola','Užice','Valjevo','Velika Plana','Vranje','Zaječar','Zrenjanin'];
const FRUITS=[['Višnje','🍒'],['Trešnje','🍒'],['Jabuke','🍎'],['Kruške','🍐'],['Šljive','🟣'],['Maline','🍓'],['Kupine','🍇'],['Borovnice','🍇'],['Jagode','🍓'],['Kajsije','🍑'],['Breskve','🍑'],['Grožđe','🍇'],['Dunje','🍋'],['Orasi','🌰'],['Lešnik','🌰']];
const COLORS=['#ee2a7b','#6228d7','#f58529','#2f6b3a','#3797f0','#c2412d','#8a5a00','#0f766e'];
const colorOf=id=>COLORS[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const initials=n=>String(n).split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();

const FARMS=LS('v4_farms')||{};
const saveFarms=()=>SAVE('v4_farms',FARMS);
const SEED_VISITS=[];
const M=60000,H=3600000,NOW=Date.now();
const SEED_GROUPS=[];

let me=LS('v4_me')||{id:'me'+NOW,name:'',phone:'',mun:'Požarevac'};
let extraVisits=LS('v4_visits')||[];
/* ===== CENOVNIK: osnovna cena (prodavac), cena po količini, doplata po mestu ===== */
const SEED_MK={};
let MARKUPS=LS('v4_mk')||SEED_MK;
const r10=x=>Math.round(x/10)*10;
const markup=(f,city)=>+((MARKUPS[f]||{})[city]||0);
function tierBase(p,q){let b=p.base;for(const t of (p.tiers||[]).slice().sort((a,b)=>a.min-b.min))if(q>=t.min&&t.price)b=t.price;return b}
function unitFor(p,v,q=1){let b=tierBase(p,q);if(p.sale)b=r10(b*(1-p.sale/100));return b+markup(v.f,v.city)*p.kg}
function hydrate(){for(const v of SEED_VISITS.concat(extraVisits))for(const p of v.packs){
  if(p.base===undefined){p.base=p.price;delete p.price}
  Object.defineProperty(p,'price',{get(){return unitFor(p,v,1)},configurable:true,enumerable:false});
  Object.defineProperty(p,'_v',{value:v,configurable:true,enumerable:false,writable:true})}}
hydrate();
/* ===== DIREKTNA NARUDŽBA: stalna ponuda farmera, bez najave dolaska, bez dodatne naplate ===== */
const SEED_CAT={};
let CATALOG=LS('v4_cat')||SEED_CAT;
let dorders=LS('v4_dorders')||[];
const saveDO=()=>{SAVE('v4_cat',CATALOG);SAVE('v4_dorders',dorders)};
const catItem=(f,id)=>(CATALOG[f]||[]).find(x=>x.id===id);
const dCity=(f,mode,mun)=>mode==='farm'?FARMS[f].town:mun;
/* ===== DOSTAVA NA KUĆNU ADRESU: prodavac odlučuje da li dostavlja, cenu dostave i od kog iznosa je besplatna ===== */
/* ===== PRODAJA IZ KUĆE PRODAVCA: adresa, dani i radno vreme ===== */
const DSHORT=['Ned','Pon','Uto','Sre','Čet','Pet','Sub'];
let SHOPS=LS('v4_shop')||{};
const saveShop=()=>SAVE('v4_shop',SHOPS);
const shopOn=f=>!!(SHOPS[f]&&SHOPS[f].on&&SHOPS[f].addr)&&active(f);
function openNow(f){const x=SHOPS[f];if(!x)return false;const d=new Date(),hm=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;return x.days.includes(d.getDay())&&hm>=x.from&&hm<x.to}
function daysTxt(ds){const o=[1,2,3,4,5,6,0].filter(d=>ds.includes(d));if(o.length===7)return 'svaki dan';const idx=o.map(d=>(d+6)%7);const run=idx.every((v,i)=>i===0||v===idx[i-1]+1);return run&&o.length>2?`${DSHORT[o[0]]}–${DSHORT[o[o.length-1]]}`:o.map(d=>DSHORT[d]).join(', ')}
const hoursTxt=f=>{const x=SHOPS[f];return `${daysTxt(x.days)} · ${x.from}–${x.to}`};
const openBadge=f=>openNow(f)?'<span class="st deal">● Otvoreno sada</span>':'<span class="st offer">Zatvoreno</span>';
let HOME=LS('v4_home')||{};
const saveHome=()=>SAVE('v4_home',HOME);
const homeOn=f=>!!(HOME[f]&&HOME[f].on);
const homeMuns=f=>Object.keys(MARKUPS[f]||{});
const homeFee=(f,sub)=>!homeOn(f)?0:(HOME[f].free&&sub>=HOME[f].free?0:+HOME[f].fee||0);
function dItems(o){return o.items.reduce((a,it)=>{const p=catItem(o.f,it.id);return p?a+unitFor(p,{f:o.f,city:dCity(o.f,o.mode,o.mun)},it.q)*it.q:a},0)}
function dTotal(o){const it=dItems(o);return it+(o.mode==='deliv'?homeFee(o.f,it):0)}
function dTotalOld(o){return o.items.reduce((a,it)=>{const p=catItem(o.f,it.id);return p?a+unitFor(p,{f:o.f,city:dCity(o.f,o.mode,o.mun)},it.q)*it.q:a},0)}
let groups=LS('v4_groups')||SEED_GROUPS;
let reservations=LS('v4_res')||[];
let leftMap=LS('v4_left')||{};
/* ===== TEZGE: kupuju se na pola meseca ili mesec; bez aktivne tezge nema objave proizvoda ===== */
const TZ={farmer:{n:'Farmer',pola:900,mesec:1500,visits:4,muns:2,items:4,d:'do 2 mesta prodaje, do 4 proizvoda po dolasku, ponude grupama, direktne porudžbine'},
 profi:{n:'Profi',pola:1500,mesec:2500,visits:99,muns:5,items:8,d:'do 5 mesta prodaje, do 8 proizvoda, ponude restoranima, direktne porudžbine'},
 zadruga:{n:'Zadruga',pola:2000,mesec:3500,visits:999,muns:99,items:12,d:'više gazdinstava pod jednim nalogom, sva mesta prodaje, direktne porudžbine'}};
const PER={free:'besplatna proba',pola:'pola meseca (15 dana)',mesec:'mesec dana'};
const isoD=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const addD=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoD(d)};
const todayISO=()=>isoD(new Date());
const fmtD=iso=>{const d=new Date(iso+'T00:00:00');return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}.`};
function endOf(start,period){if(period==='pola')return addD(start,14);const d=new Date(start+'T00:00:00');d.setMonth(d.getMonth()+1);d.setDate(d.getDate()-1);return isoD(d)}
let FARM_SUB=LS('v4_sub')||{};
let TINV=LS('v4_tinv')||[];
const saveTZ=()=>{SAVE('v4_sub',FARM_SUB);SAVE('v4_tinv',TINV)};
let FREE={on:false,until:''};
const freeOn=()=>!!(FREE.on&&(!FREE.until||FREE.until>=todayISO()));
const subOf=f=>{const x=FARM_SUB[f];if(x&&x.until>=todayISO())return x;return freeOn()&&FARMS[f]?{plan:'profi',period:'free',from:todayISO(),until:FREE.until||addD(todayISO(),365),free:true}:x};
const active=f=>{const x=subOf(f);return !!x&&x.until>=todayISO()};
const paidFarm=active;
const daysLeft=f=>{const x=subOf(f);return x?Math.round((new Date(x.until+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5)+1:0};
function limOf(f){const x=subOf(f);if(!x)return {visits:0,muns:0,items:2};const t=TZ[x.plan];return {visits:x.period==='pola'&&t.visits<99?Math.ceil(t.visits/2):t.visits,muns:t.muns,items:t.items}}
function buyTezga(planId){const f=state.sfarm,per=state.tzPer||'mesec',amt=TZ[planId][per];const cur=FARM_SUB[f];
  const start=active(f)?addD(cur.until,1):todayISO(),end=endOf(start,per);
  const inv={no:'T-'+String(Date.now()).slice(-5),f,plan:planId,period:per,amount:amt,from:start,until:end,paid:false};TINV.unshift(inv);saveTZ();render();payTezga(inv.no)}
function payTezga(no){const i=TINV.find(x=>x.no===no);
  qrSheet({title:'Plati tezgu',sub:`Tezga ${TZ[i.plan].n} · ${PER[i.period]} · ${fmtD(i.from)}–${fmtD(i.until)}`,acct:VOCARA.acct,name:VOCARA.name,amount:i.amount,purpose:`Tezga ${TZ[i.plan].n} ${i.period}`,ref:i.no.replace(/\D/g,''),sf:'221',payLabel:cloud.on?'Uplatio/la sam':'Označi kao plaćeno (demo)',
   onPaid:()=>{if(cloud.on){const j=TINV.find(x=>x.no===no)||i;j.reported=Date.now();saveTZ();toast('Uplata prijavljena ✓ Tezga se aktivira kad uplata stigne na račun Voćare');render();return}i.paid=true;const cur=FARM_SUB[i.f];FARM_SUB[i.f]={plan:i.plan,period:i.period,from:cur&&active(i.f)?cur.from:i.from,until:i.until};saveTZ();toast(`Tezga aktivna do ${fmtD(i.until)} ✓`);render()}})}
function cancelInv(no){TINV=TINV.filter(x=>x.no!==no);saveTZ();render()}
function scrollTz(){const el=document.getElementById('tzpanel');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}

   <label style="margin-top:0">Šta tražite?</label><form class="searchbar" style="margin:0;padding-right:4px" onsubmit="event.preventDefault();doSearch()">${IC.search.replace('<svg','<svg style="width:20px;height:20px;color:#888"')}<input id="sq" type="search" enterkeyhint="search" placeholder="npr. višnje, jabuke, orah" value="${esc(state.sq||'')}" oninput="state.sq=this.value;renderSR()" autocomplete="off"><button type="submit" class="sbtn">Traži</button></form>
   <div class="chips" style="padding:8px 0 0">${SUGG.map(x=>`<button class="chip ${norm(state.sq)===norm(x)?'on':''}" onclick="state.sq='${x}';document.getElementById('sq').value='${x}';renderSR();document.querySelectorAll('.panel .chip').forEach(c=>c.classList.toggle('on',c.textContent==='${x}'))">${x}</button>`).join('')}</div>
   <label>Gde?</label><select id="spl" onchange="state.splace=this.value;renderSR()"><option value="" ${state.splace?'':'selected'}>Bilo gde u Srbiji</option>${MUNS.map(m=>`<option ${m===state.splace?'selected':''}>${m}</option>`).join('')}</select>

function doSearch(){const i=document.getElementById('sq');state.sq=i.value.trim();renderSR();i.blur();const r=document.getElementById('sr');if(r)setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function renderSR(){const el=document.getElementById('sr');if(el)el.innerHTML=searchResults();document.querySelectorAll('.panel .chips .chip').forEach(c=>c.classList.toggle('on',norm(c.textContent)===norm(state.sq)))}
function searchResults(){const q=state.sq||'',pl=state.splace||'';const qn=q.trim();
  const secs=[];
  // 1. dolasci u mesto
  const vis=allPacks().filter(({v,p})=>(!pl||v.city===pl)&&matchP(p,qn)&&left(p));
  if(vis.length)secs.push(`<div class="shead"><h2 style="font-size:19px">🚚 Farmer dolazi${pl?`: ${esc(pl)}`:''}</h2><span class="muted">${vis.length}</span></div><div class="pgrid">${vis.map(pcard).join('')}</div>`);
  // catalog matches
  const cat=[];for(const [fid,items] of Object.entries(CATALOG)){const f=+fid;if(!active(f))continue;for(const p of items)if(matchP(p,qn))cat.push({f,p})}
  // 2. dostava kući u mesto
  if(pl){const dl=cat.filter(x=>homeOn(x.f)&&homeMuns(x.f).includes(pl));
    if(dl.length)secs.push(`<div class="shead"><h2 style="font-size:19px">🏠 Dostava na adresu: ${esc(pl)}</h2></div>${dl.map(x=>catRow(x,pl,'deliv')).join('')}`)}
  // 3. kupi kod prodavca u mestu
  const sh=cat.filter(x=>shopOn(x.f)&&(!pl||FARMS[x.f].town===pl));
  if(sh.length)secs.push(`<div class="shead"><h2 style="font-size:19px">🏡 Kupi kod prodavca${pl?`: ${esc(pl)}`:''}</h2></div>${sh.map(x=>catRow(x,FARMS[x.f].town,'shop')).join('')}`);
  // 4. direktno sa imanja (ostali)
  const used=new Set(sh.map(x=>x.p.id).concat(pl?cat.filter(x=>homeOn(x.f)&&homeMuns(x.f).includes(pl)).map(x=>x.p.id):[]));
  const rest=cat.filter(x=>!used.has(x.p.id));
  if(rest.length)secs.push(`<div class="shead"><h2 style="font-size:19px">🏡 Direktno sa imanja${pl?' (drugi gradovi)':''}</h2></div>${rest.map(x=>catRow(x,FARMS[x.f].town,'farm')).join('')}`);
  // 5. grupe
  const gr=groups.filter(g=>(!qn||norm(g.fruit+' '+g.title).includes(norm(qn).slice(0,4)))&&(!pl||g.buyerMun===pl||g.members.some(m=>m.mun===pl)));
  if(gr.length)secs.push(`<div class="shead"><h2 style="font-size:19px">💬 Grupe komšija</h2></div><div class="inbox">${inboxRows(gr)}</div>`);
  const none=!secs.length;
  return (none?`<div class="empty"><div>🔍</div>${qn?`Nema ponude za „${esc(qn)}“${pl?` u mestu ${esc(pl)}`:''}.`:'Nema rezultata.'}</div>`:secs.join(''))+
   `<button class="gbanner" onclick="go('newgroup',{preFruit:'${(FRUITS.find(f=>qn&&norm(f[0]).startsWith(norm(qn).slice(0,4)))||['Jabuke'])[0]}'})"><div class="ic">${IC.users}</div><div><b>${none?'Napravite grupu i pozovite farmere':'Ne vidite pravu ponudu?'}</b>Napravite grupu${qn?` za „${esc(qn)}“`:''}${pl?` u mestu ${esc(pl)}`:''}, a farmeri vam šalju ponude.</div></button>`}
function catRow({f,p},city,mode){const F=FARMS[f],u=unitFor(p,{f,city},1),ph=photo(p);
  return `<button class="citem" style="width:100%;text-align:left" onclick="dform.mode='${mode==='deliv'?'deliv':'farm'}';dform.mun='${esc(city)}';go('farm',{farm:${f}})">
   <div class="thumb" style="background:${BGS[p.e]||'#f0eee6'}">${ph?`<img src="${ph}">`:p.e}</div>
   <div style="flex:1;min-width:0"><b>${esc(pname(p))}</b><div class="muted">${esc(F.name)} · ${esc(F.town)}${mode==='shop'?` · ${openNow(f)?'<b style="color:var(--green)">otvoreno</b>':'zatvoreno'}`:''}</div>
   <div class="muted">${mode==='deliv'?`🏠 dostava ${HOME[f].fee?fmt(HOME[f].fee):'besplatna'}${HOME[f].free?`, besplatna od ${fmt(HOME[f].free)}`:''}`:mode==='shop'?`🏡 ${esc(SHOPS[f].addr)} · ${hoursTxt(f)}`:'🏡 preuzimanje na imanju'}</div></div>
   <div style="text-align:right"><div style="color:var(--green);font-weight:800">${fmt(u)}${isKg(p)?'/kg':''}</div><div class="muted" style="font-size:12px">${mode==='deliv'&&markup(f,city)?'sa doplatom':''}</div></div></button>`}
function viewRes(){const mine=reservations.filter(r=>r.mine),deals=groups.filter(g=>g.status==='deal'&&isMember(g)),dmine=dorders.filter(o=>o.mine);
  if(!mine.length&&!deals.length&&!dmine.length)return `<div class="empty"><div>🎟️</div>Nemate rezervacija.<br><button class="primary" style="max-width:260px" onclick="go('home')">Pogledaj dolaske</button></div>`;
  return `${dmine.length?`<h2 class="sec">Direktne porudžbine</h2>${dmine.map(o=>dOrderCard(o,false)).join('')}`:''}
  ${mine.length?`<h2 class="sec">Rezervacije sa dolazaka</h2><p class="muted">Pokažite šifru prodavcu pri preuzimanju.</p>`:''}
  ${mine.map(r=>{const {v,p}=findPack(r.pack);if(!v)return '';return `<div class="res"><div style="display:flex;justify-content:space-between;align-items:center"><b>${p.e} ${isKg(p)?`${esc(p.n)}, ${r.qty} kg`:`${esc(pname(p))} × ${qty(p,r.qty)}`}</b><span class="code">${r.code}</span></div>
    <div class="muted" style="margin-top:4px">${esc(FARMS[v.f].name)}${r.group?' · zajednička gajba':''}</div><div style="margin-top:6px;font-size:14px">🗓 <b>${dLabel(vDate(v))}</b> ${r.home?'(posle dolaska u grad)':esc(v.time)}<br>${r.home?`🏠 Dostava na adresu: <b>${esc(r.addr)}</b>, ${esc(v.city)}`:`📍 ${esc(v.city)}, ${esc(v.area)}: ${esc(v.place)}`}</div>
    ${r.home?`<div class="sum"><span>🏠 Dostava</span><span>${r.fee?fmt(r.fee):'besplatno'}</span></div>`:''}<div class="sum big"><span>Za plaćanje</span><span>${fmt((r.unit||p.price)*r.qty+(r.fee||0))}</span></div>
    ${r.paid?'<div class="paidtag">✅ Plaćeno IPS-om</div>':`<button class="ipsbtn" onclick="payRes('${r.code}')">📱 Plati IPS-om pri preuzimanju</button><div class="muted" style="text-align:center;margin-top:4px">ili gotovinom kod farmera</div>`}
    ${r.group||r.paid?'':`<button class="ghost" onclick="cancelRes('${r.code}',this)">Otkaži rezervaciju</button>`}</div>`}).join('')}
  ${deals.length?`<h2 class="sec">Dogovori iz grupa</h2>${deals.map(g=>{const my=g.members.find(m=>m.id===me.id);return `<div class="res" onclick="go('group',{group:'${g.id}'})" style="cursor:pointer"><b>${g.e} ${esc(g.title)}</b><div class="muted">${esc(FARMS[g.offer.farm].name)} · ${esc(g.offer.when)}</div><div class="sum big"><span>Vaš deo: ${my.kg} kg</span><span>${fmt(my.kg*g.offer.price)}</span></div>${my.paid?'<div class="paidtag">✅ Plaćeno IPS-om</div>':'<div class="muted" style="color:var(--ig);font-weight:600">Otvorite grupu da platite svoj deo →</div>'}</div>`}).join('')}`:''}`}
function cancelRes(c,btn){if(!btn.dataset.ok){btn.dataset.ok=1;btn.textContent='Dodirni ponovo za otkazivanje';btn.style.color='var(--red)';return}
  const r=reservations.find(x=>x.code===c);const {p}=findPack(r.pack);if(p)untake(p,r.qty);reservations=reservations.filter(x=>x.code!==c);if(cloud.on)firebase.firestore().collection('orders').doc(c).delete().catch(e=>toast(fbMsg(e)));saveAll();toast('Rezervacija otkazana');render()}

function lastMsg(g){const m=g.msgs[g.msgs.length-1];if(m.uid==='sys')return m.t;if(m.type==='offer')return `${nameOf(g,m.uid)} je poslao ponudu 💰`;if(m.type==='img')return `${m.uid===me.id?'Vi':nameOf(g,m.uid).split(' ')[0]}: 📷 Slika`;return `${m.uid===me.id?'Vi':nameOf(g,m.uid).split(' ')[0]}: ${m.t}`}
function viewInbox(){
  let list=groups.slice().sort((a,b)=>b.msgs[b.msgs.length-1].ts-a.msgs[a.msgs.length-1].ts);
  if(state.tab==='mine')list=list.filter(isMember);
  if(state.tab==='near')list=list.filter(g=>g.buyerMun===me.mun||g.members.some(m=>m.mun===me.mun));
  const q=state.q.toLowerCase();if(q)list=list.filter(g=>(g.title+' '+g.fromMun+' '+g.buyerMun+' '+g.fruit).toLowerCase().includes(q));
  return `<div class="dmtop" style="margin-top:14px"><span class="muted">Grupe za zajedničku kupovinu</span><button class="primary blue" style="width:auto;margin:0;padding:9px 14px;font-size:14px" onclick="go('newgroup')">＋ Nova grupa</button></div>
  <input class="search" placeholder="🔍 Traži voće ili opštinu" value="${esc(state.q)}" oninput="state.q=this.value;renderInboxList()">
  <div class="stories"><button class="story" onclick="go('newgroup')"><div class="ring add"><div>＋</div></div><span>Nova grupa</span></button>
   ${FRUITS.slice(0,8).map(([n,e])=>`<button class="story" onclick="go('newgroup',{preFruit:'${n}'})"><div class="ring"><div>${e}</div></div><span>${n}</span></button>`).join('')}</div>
  <div class="chips">${[['all','Sve grupe'],['mine','Moje'],['near','U mojoj opštini']].map(([k,l])=>`<button class="chip ${state.tab===k?'on':''}" onclick="state.tab='${k}';render()">${l}</button>`).join('')}</div>
  <div class="inbox" id="ilist">${inboxRows(list)}</div>`}
function inboxRows(list){return list.length?list.map(g=>`<button class="row ${g.unread?'unread':''}" onclick="openGroup('${g.id}')">
   <div class="gav">${g.e}<small>${g.status==='deal'?'🤝':g.status==='offer'?'💰':'👥'}</small></div>
   <div class="tx"><div class="tt">${esc(g.title)}</div><div class="pv">${esc(lastMsg(g))} · ${ago(g.msgs[g.msgs.length-1].ts)}</div>
   <div class="muted" style="font-size:12px">👥 ${g.members.length} · ${totalKg(g)} kg · iz ${esc(g.fromMun)} → ${esc(g.buyerMun)}</div></div>
   ${g.unread?'<span class="bdot"></span>':''}</button>`).join(''):`<div class="empty"><div>💬</div>Nema grupa. Napravite prvu!</div>`}
function renderInboxList(){const el=document.getElementById('ilist');if(!el)return;state.view='inbox';const html=viewInbox();const tmp=document.createElement('div');tmp.innerHTML=html;el.innerHTML=tmp.querySelector('#ilist').innerHTML}
function openGroup(id){const g=groups.find(x=>x.id===id);if(!g)return;markSeen(g);go('group',{group:id})}
function packGroup(pid){const ex=groups.find(g=>g.pack===pid&&g.status!=='deal');if(ex){openGroup(ex.id);return}go('newgroup',{prePack:pid})}

  const pre=state.preFruit||'Višnje';

async function createGroup(e){
  e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  if(!validPhone(d.phone)){toast('Unesite ispravan broj mobilnog');return}
  me.name=d.name.trim();me.phone=d.phone.trim();me.mun=d.mun;SAVE('v4_me',me);
  let g;const kg=Math.max(1,+d.kg);
  if(d.pack){const {v,p}=findPack(d.pack);g={id:'g'+Date.now(),title:`${p.n} – ${v.area}`,fruit:p.n,e:p.e,fromMun:FARMS[v.f].town,buyerMun:v.city,creator:me.id,pack:p.id,status:'open',members:[],msgs:[]};
    g.msgs.push({uid:'sys',t:`${me.name} je napravio/la grupu za paket „${p.n} ${p.kg} kg“.`,ts:Date.now()})}
  else{const fr=FRUITS.find(f=>f[0]===d.fruit);const title=d.fromMun?`${fr[0]} iz opštine ${d.fromMun}`:`${fr[0]} za ${d.mun}`;
    g={id:'g'+Date.now(),title,fruit:fr[0],e:fr[1],fromMun:d.fromMun||'bilo koje opštine',buyerMun:d.mun,creator:me.id,status:'open',members:[],msgs:[{uid:'sys',t:`${me.name} je napravio/la grupu „${title}“.`,ts:Date.now()}]}}
  g.members.push({id:me.id,name:me.name,mun:me.mun,kg});
  const t=(d.msg||'').trim()||`Tražim ${kg} kg. Ko je iz opštine ${me.mun} ili okoline, udružimo se! 🙌`;
  g.msgs.push({uid:me.id,t,ts:Date.now()+1});
  const r=checkPack(g);
  if(cloud.on){try{await firebase.firestore().collection('groups').doc(g.id).set(strip(g))}catch(err){toast('Grupa nije napravljena: '+fbMsg(err));return}if(!groups.find(x=>x.id===g.id))groups.unshift(g)}
  else groups.unshift(g);
  dealSide(g,r);markSeen(g);state.prePack=null;state.preFruit=null;saveAll();toast('Grupa napravljena ✓');go('group',{group:g.id});
}
function viewGroup(){
  const g=groups.find(x=>x.id===state.group);if(!g)return viewInbox();
  const tot=totalKg(g),mine=g.members.find(m=>m.id===me.id);
  const pk=g.pack?findPack(g.pack):null;
  let pin=`<div class="pin"><h4>Zajednička porudžbina · <span class="st ${g.status}">${{open:'Prikupljanje',offer:'Stigla ponuda',deal:'Dogovoreno'}[g.status]}</span></h4>
   <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><span class="total">${tot} kg</span><span class="muted">${g.e} ${esc(g.fruit)} · od proizvođača iz ${esc(g.fromMun)}</span></div>`;
  if(pk&&pk.p){const need=pk.p.kg,pct=Math.min(100,tot/need*100);
    pin+=`<div class="prog"><i style="width:${g.reserved?100:pct}%"></i></div><div class="muted">${g.reserved?`✅ Rezervisano ${g.reserved} pak. kod ${esc(FARMS[pk.v.f].name)}, ${dLabel(vDate(pk.v))} ${esc(pk.v.time)}`:`Paket je ${need} kg · fali još ${Math.max(0,need-tot)} kg · ${fmt(pk.p.price/need)}/kg`}</div>`}
  pin+=`<div style="margin-top:8px">${g.members.map(m=>`<div class="mem">${avatar(g,m.id)}<div><div>${esc(m.name)}${m.id===me.id?' (vi)':''}${m.id===g.creator?' · 🏠':''}</div><div class="muted" style="font-size:12px">📍 ${esc(m.mun)} ${m.paid?'<span class="ok">· 💳 platio</span>':m.ok?'<span class="ok">· ✓ prihvatio</span>':''}</div></div><span class="k">${m.kg} kg</span></div>`).join('')}</div>`;
  if(g.status!=='deal'){
    pin+=mine?`<form class="joinrow" onsubmit="changeKg(event,'${g.id}')"><input name="kg" type="number" min="1" value="${mine.kg}"><button>Promeni moju količinu</button></form>`
      :`<form onsubmit="joinGroup(event,'${g.id}')">${me.name&&me.phone?'':`<div class="two"><div><label>Ime i prezime</label><input name="name" required placeholder="Vaše ime"></div><div><label>Telefon</label><input name="phone" required placeholder="06x xxx xxxx"></div></div>`}
        <div class="two"><div><label>Vaša opština</label><select name="mun">${MUNS.map(m=>`<option ${m===(me.mun||g.buyerMun)?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Koliko vam treba</label><input name="kg" type="number" min="1" required value="10"></div></div>
        <button class="primary blue" type="submit">Pridruži se grupi</button></form>`}
  if(g.status==='deal'&&mine&&g.offer)pin+=`<div class="sum big"><span>Vaš deo: ${mine.kg} kg</span><span>${fmt(mine.kg*g.offer.price)}</span></div>${mine.paid?'<div class="paidtag">✅ Platili ste svoj deo</div>':`<button class="ipsbtn" onclick="payPart('${g.id}')">📱 Plati svoj deo IPS-om · ${fmt(mine.kg*g.offer.price)}</button><div class="muted" style="text-align:center;margin-top:4px">ili gotovinom pri preuzimanju</div>`}`;
  pin+='</div>';
  let last=0,prev=null,out='';
  for(const m of g.msgs){
    if(m.ts-last>45*M){out+=`<div class="tsep">${clock(m.ts)}</div>`;prev=null}last=m.ts;
    if(m.uid==='sys'){out+=`<div class="sysm">${esc(m.t)}</div>`;prev=null;continue}
    if(m.type==='offer'){const o=g.offer;if(!o)continue;out+=`${prev!==m.uid?`<div class="who">${esc(nameOf(g,m.uid))} · proizvođač</div>`:''}<div class="offer"><div class="h">💰 Ponuda za ${tot} kg</div><div class="p">${fmt(o.price)}/kg</div>
      <div style="font-size:14px">🗓 ${esc(o.when)}<br>🚚 ${esc(o.where)}</div><div class="sum" style="margin-top:6px"><span>Ukupno</span><b>${fmt(o.price*tot)}</b></div>
      ${mine&&!mine.ok&&g.status==='offer'?`<button class="primary" style="padding:10px;margin-top:8px;font-size:14px" onclick="acceptOffer('${g.id}')">Prihvatam · moj deo ${fmt(mine.kg*o.price)}</button>`:''}</div>`;prev=m.uid;continue}
    const isMe=m.uid===me.id,i=g.msgs.indexOf(m);
    if(!isMe&&prev!==m.uid)out+=`<div class="who">${esc(nameOf(g,m.uid))}</div>`;
    out+=`<div class="mline ${isMe?'me':''}">${isMe?'':avatar(g,m.uid)}<div class="bub ${m.type==='img'?'ph':''}" ondblclick="heart('${g.id}',${i})">${m.type==='img'?`<img class="bimg" src="${m.img}" alt="slika">`:esc(m.t)}${m.heart?'<span class="heart">❤️</span>':''}</div></div>`;prev=m.uid}
  if(typing[g.id])out+=`<div class="who">${esc(nameOf(g,typing[g.id]))}</div><div class="mline">${avatar(g,typing[g.id])}<div class="typing"><i></i><i></i><i></i></div></div>`;
  return `<div class="chathead"><button class="bk" onclick="go('inbox')">‹</button><div class="gav">${g.e}</div><div style="min-width:0"><div class="tt">${esc(g.title)}</div><div class="muted">${g.members.length} člana · ${tot} kg · ${esc(g.buyerMun)}</div></div></div>
  ${pin}<div class="msgs">${out}</div>

async function joinGroup(e,gid){

  me.mun=d.mun;SAVE('v4_me',me);const kg=Math.max(1,+d.kg);
  const r=await mut(gid,g=>{if(g.members.some(m=>m.id===me.id))return;g.members.push({id:me.id,name:me.name,mun:me.mun,kg});
    g.msgs.push({uid:'sys',t:`${me.name} se pridružio/la sa ${kg} kg · ukupno ${totalKg(g)} kg`,ts:Date.now()});
    if(g.offer&&g.status==='offer')g.msgs.push({uid:'sys',t:'Ponuda važi i za novu ukupnu količinu. Prihvatite je u kartici ponude.',ts:Date.now()+1});
    return checkPack(g)});

function changeKg(e,gid){e.preventDefault();const kg=Math.max(1,+e.target.elements.kg.value);
  mut(gid,g=>{const m=g.members.find(m=>m.id===me.id);if(!m||kg===m.kg)return;m.kg=kg;m.ok=false;g.msgs.push({uid:'sys',t:`${me.name} sada uzima ${kg} kg · ukupno ${totalKg(g)} kg`,ts:Date.now()});return checkPack(g)})
   .then(r=>{dealSide(groups.find(x=>x.id===gid),r);render();scrollEnd()})}
function checkPack(g){if(!g.pack||g.reserved)return;const {v,p}=findPack(g.pack);if(!p)return;const tot=totalKg(g);
  if(tot>=p.kg){const n=Math.min(Math.floor(tot/p.kg),left(p));if(!n)return;const c=code();g.reserved=n;g.resCode=c;g.status='deal';g.offer={farm:v.f,price:p.price/p.kg,when:`${dLabel(vDate(v))} ${v.time}`,where:`${v.city}, ${v.area}: ${v.place}`};
    g.msgs.push({uid:'sys',t:`✅ Skupljeno ${tot} kg! Rezervisano ${n} paket(a), šifra ${c}. Domaćin ${g.members[0].name} preuzima i deli.`,ts:Date.now()+2});return {pid:p.id,n,c}}}
function dealSide(g,r){if(!g||!r||!r.n)return;const {p}=findPack(r.pid);if(!p)return;take(p,r.n);
  const host=g.members[0]||{};reservations.unshift({code:r.c,pack:p.id,qty:r.n,group:g.id,mine:g.creator===me.id,buyerUid:g.creator,buyer:{name:host.name||'',phone:g.creator===me.id?me.phone:''}});saveAll()}

  else g.msgs.push({uid:'sys',t:`Čeka se još ${g.members.filter(x=>!x.ok).length} člana da prihvati.`,ts:Date.now()+1})}).then(()=>{render();scrollEnd()})}

function applyOrders(){const all={};for(const o of ordBuyer.concat(ordSeller))all[o.id]=o;const res=[],dor=[];
  for(const o of Object.values(all)){lastSync[o.id]=JSON.stringify(o.data);const x={...o.data,mine:o.buyerUid===authUid,buyerUid:o.buyerUid,buyer:o.buyer||o.data.buyer};(o.kind==='res'?res:dor).push(x)}
  res.sort((a,b)=>(b.ts||0)-(a.ts||0));dor.sort((a,b)=>(b.ts||0)-(a.ts||0));reservations=res;dorders=dor;softRender()}
function syncOrders(){if(!cloud.on||!authUid)return;const col=firebase.firestore().collection('orders');
  const push=(kind,id,data,fid,buyerUid,buyer)=>{const {mine,...rest}=data;const clean=strip({...rest,ts:rest.ts||Date.now()});const js=JSON.stringify(clean);if(lastSync[id]===js)return;
    const F=FARMS[fid];if(!F||!F.uid)return;lastSync[id]=js;
    col.doc(id).set(strip({id,kind,fid,sellerUid:F.uid,buyerUid:buyerUid||authUid,buyer:buyer||{name:me.name,phone:me.phone},data:clean,updated:Date.now()}),{merge:true}).catch(e=>{delete lastSync[id];toast('Nije poslato prodavcu: '+fbMsg(e))})};
  for(const r of reservations){if(!r.ts)r.ts=Date.now();const {v}=findPack(r.pack);if(!v)continue;push('res',r.code,r,v.f,r.buyerUid,r.buyer)}
  for(const o of dorders){push('dir',o.id,o,o.f,o.buyerUid,o.buyer)}}
async function cloudRegFarm(d){const fid=Date.now();
  const doc={fid,name:d.name.trim(),town:d.town,phone:d.phone.trim(),acct:(d.acct||'').replace(/\D/g,''),e:d.e||'🧑‍🌾',email:user.email,catalog:[],mk:{[d.town]:0},visits:[],sub:null,shop:null,home:null,created:Date.now()};
  try{await firebase.firestore().collection('farms').doc(user.uid).set(doc);if(!me.phone){me.phone=doc.phone;SAVE('v4_me',me)}toast(freeOn()?'Registracija uspela ✓ Sada dodajte voće':'Registracija uspela ✓ Sada kupite tezgu')}
  catch(err){toast(fbMsg(err))}}
const strip=o=>JSON.parse(JSON.stringify(o));
function farmDoc(f){const F=FARMS[f];return strip({fid:f,name:F.name,town:F.town,phone:F.phone||'',acct:F.acct||'',e:F.e,email:user.email,catalog:CATALOG[f]||[],sub:cloudSub[f]||null,inv:TINV.filter(i=>i.f===f),shop:SHOPS[f]||null,home:HOME[f]||null,mk:MARKUPS[f]||{},
  visits:extraVisits.filter(v=>v.f===f).map(v=>({...v,packs:v.packs.map(p=>({...p}))})),updated:Date.now()})}
window.onSave=k=>{if(cloud.on&&(k==='v4_res'||k==='v4_dorders'))syncOrders();if(!cloud.on||!user||!myFid||!/^v4_(cat|shop|home|sub|tinv|mk|visits|farms)$/.test(k))return;clearTimeout(pushT);
  pushT=setTimeout(()=>firebase.firestore().collection('farms').doc(user.uid).set(farmDoc(myFid)).catch(err=>toast('Nije sačuvano na serveru: '+fbMsg(err))),400)};
function applyFarms(snap){
  for(const o of [FARMS,CATALOG,FARM_SUB,SHOPS,HOME,MARKUPS,cloudSub])for(const k of Object.keys(o))delete o[k];
  const vs=[],inv=[];myFid=null;farmDocs={};
  snap.forEach(doc=>{const d=doc.data();const f=+d.fid;if(!f)return;
   FARMS[f]={name:d.name,town:d.town,phone:d.phone,acct:d.acct,e:d.e||'🧑‍🌾',uid:doc.id};CATALOG[f]=d.catalog||[];if(d.sub){FARM_SUB[f]=d.sub;cloudSub[f]=d.sub}for(const i of d.inv||[])inv.push({...i,f});farmDocs[f]={uid:doc.id,data:d};if(d.shop)SHOPS[f]=d.shop;if(d.home)HOME[f]=d.home;MARKUPS[f]=d.mk||{[d.town]:0};
   for(const v of d.visits||[])vs.push({...v,f});if(user&&doc.id===user.uid)myFid=f});
  extraVisits.length=0;extraVisits.push(...vs);TINV=inv.sort((a,b)=>String(b.no).localeCompare(String(a.no)));hydrate();cloud.ready=true;
  softRender()}

function viewAdmin(){if(!isAdmin())return '<div class="empty">Samo za administratora.</div>';
  const ver=user.emailVerified;const pend=TINV.filter(i=>!i.paid).sort((a,b)=>(b.reported||0)-(a.reported||0));
  const act=Object.keys(FARMS).map(Number).filter(f=>active(f));
  return `<h2 class="sec">🛠 Admin: uplate za tezge</h2><p class="muted">Prijavljeni ste kao ${esc(user.email)}. <button class="ghost" style="width:auto;display:inline;padding:4px 10px" onclick="logout()">Odjava</button></p>
  ${ver?'':`<div class="panel" style="background:#fdecea"><b>Potvrdite e-mail adresu</b><p class="muted" style="margin:4px 0 8px">Iz bezbednosnih razloga aktiviranje tezgi radi tek kad potvrdite ${esc(ADMIN)}. Otvorite poruku od Firebase-a u Gmail-u i kliknite link, pa ovde kliknite „Proveri“.</p><button class="primary" onclick="adminVerify()">Pošalji link za potvrdu</button><button class="ghost" style="margin-top:6px" onclick="adminReload()">Proveri (već sam kliknuo link)</button></div>`}
  <div class="panel"><h3 style="font-size:18px">🎁 Besplatna proba</h3><p class="muted" style="margin:4px 0 8px">Kad je uključena, svi registrovani prodavci imaju tezgu besplatno i mogu odmah da dodaju voće, bez uplate.</p>
   <label class="chk"><input type="checkbox" id="fron" ${FREE.on?'checked':''}> Uključi besplatnu probu za sve prodavce</label>
   <label>Besplatno do (prazno = dok ne isključite)</label><input type="date" id="frun" value="${esc(FREE.until||'')}">
   <button class="primary" style="margin-top:8px" ${ver?'':'disabled'} onclick="saveFree()">Sačuvaj</button>
   <p class="muted" style="margin-top:6px">Sada: <b>${freeOn()?`uključena${FREE.until?' do '+fmtD(FREE.until):''}`:'isključena'}</b></p></div>
  <div class="panel"><h3 style="font-size:18px">Čekaju uplatu (${pend.length})</h3>
  ${pend.map(i=>{const F=FARMS[i.f]||{};return `<div class="inv unpaid"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(F.name||'?')}</b>${i.reported?'<span class="st open">Prijavio uplatu</span>':'<span class="st offer">Nije platio</span>'}</div>
   <div class="muted">📍 ${esc(F.town||'')} · 📞 ${esc(F.phone||'')}</div>
   <div class="muted">Tezga ${TZ[i.plan].n} · ${PER[i.period]} · poziv na broj <b>${esc(String(i.no).replace(/\D/g,''))}</b>${i.reported?` · prijavio ${new Date(i.reported).toLocaleString('sr-RS')}`:''}</div>
   <div class="sum big"><span>Iznos</span><span>${fmt(i.amount)}</span></div>
   <button class="primary" ${ver?'':'disabled'} onclick="adminActivate(${i.f},'${esc(i.no)}')">✅ Uplata stigla, aktiviraj tezgu</button>
   <button class="ghost" ${ver?'':'disabled'} onclick="adminReject(${i.f},'${esc(i.no)}')">✕ Obriši račun</button></div>`}).join('')||'<p class="muted">Nema računa koji čekaju.</p>'}</div>
  <div class="panel"><h3 style="font-size:18px">Aktivni prodavci (${act.length})</h3>${act.map(f=>`<div class="sum"><span>${esc(FARMS[f].name)} · ${esc(FARMS[f].town)} · ${subOf(f).free?'🎁 besplatna proba':TZ[subOf(f).plan].n}</span><span>${subOf(f).free&&!FREE.until?'bez roka':'do '+fmtD(subOf(f).until)}</span></div>`).join('')||'<p class="muted">Još nema aktivnih tezgi.</p>'}
  <p class="muted" style="margin-top:8px">Ukupno prodavaca: ${Object.keys(FARMS).length}</p></div>`}
async function saveFree(){const on=document.getElementById('fron').checked,until=document.getElementById('frun').value||'';
  try{await firebase.firestore().collection('config').doc('app').set({freeOn:on,freeUntil:until,updated:Date.now()});toast(on?'Besplatna proba uključena ✓':'Besplatna proba isključena')}catch(e){toast('Nije uspelo: '+fbMsg(e))}}
async function adminVerify(){try{await user.sendEmailVerification();toast('Link je poslat na '+user.email)}catch(e){toast(fbMsg(e))}}
async function adminReload(){try{await user.reload();user=firebase.auth().currentUser;await user.getIdToken(true);toast(user.emailVerified?'E-mail potvrđen ✓':'Još nije potvrđeno');render()}catch(e){toast(fbMsg(e))}}
async function adminActivate(f,no){const fd=farmDocs[f];if(!fd)return;const d=fd.data;const inv=(d.inv||[]).map(x=>({...x}));const i=inv.find(x=>x.no===no);if(!i)return;
  const t=todayISO(),cur=d.sub,curOn=cur&&cur.until>=t;const from=curOn?addD(cur.until,1):t;const until=endOf(from,i.period);
  i.paid=true;i.from=from;i.until=until;i.confirmed=Date.now();
  const sub={plan:i.plan,period:i.period,from:curOn?cur.from:from,until};
  try{await firebase.firestore().collection('farms').doc(fd.uid).update({sub,inv});toast(`Aktivirano: ${FARMS[f].name} do ${fmtD(until)} ✓`)}catch(e){toast('Nije uspelo: '+fbMsg(e))}}
async function adminReject(f,no){const fd=farmDocs[f];if(!fd||!confirm('Obrisati ovaj račun?'))return;
  try{await firebase.firestore().collection('farms').doc(fd.uid).update({inv:(fd.data.inv||[]).filter(x=>x.no!==no)});toast('Račun obrisan')}catch(e){toast(fbMsg(e))}}
let farmsUnsub=null;
function cloudInit(){if(!window.firebase||!firebase.initializeApp)return;groups=[];reservations=[];dorders=[];
  try{firebase.initializeApp(FB_CFG)}catch(e){return}
  cloud.on=true;
  firebase.firestore().collection('groups').onSnapshot(applyGroups,()=>{});
  firebase.firestore().collection('stock').onSnapshot(sn=>{for(const k of Object.keys(stockMap))delete stockMap[k];sn.forEach(d=>{stockMap[d.id]=d.data().taken||0});softRender()},()=>{});
  firebase.firestore().collection('config').doc('app').onSnapshot(d=>{const x=d.exists?d.data():{};FREE={on:!!x.freeOn,until:x.freeUntil||''};softRender()},()=>{});
  const listen=()=>{if(farmsUnsub)farmsUnsub();farmsUnsub=firebase.firestore().collection('farms').onSnapshot(applyFarms,err=>{cloud.ready=true;cloud.err='Baza nije dostupna: '+fbMsg(err);render()})};
  firebase.auth().onAuthStateChanged(async u=>{
   if(!u){authUid=null;user=null;try{await firebase.auth().signInAnonymously()}catch(e){cloud.err='Prijava gosta nije uključena: '+fbMsg(e);render()}return}
   authUid=u.uid;if(me.id!==u.uid&&u.isAnonymous){me.id=u.uid;SAVE('v4_me',me)}
   user=u.isAnonymous?null:u;listenOrders();
   if(u&&pendingReg){const d=pendingReg;pendingReg=null;if(u.email!==ADMIN)await cloudRegFarm(d);try{await u.sendEmailVerification()}catch(e){}}
   listen();render()})}
cloudInit();
setTimeout(showPops,1500);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
